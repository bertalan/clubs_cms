{% load i18n static %}
<div class="federation-key-tools" data-federation-key-tools
     data-generate-url="{% url 'federation_generate_keys' %}"
     data-confirm-replace="{% trans 'Replace the current link key and shared secret? The partner will need the new pair too.' %}"
     data-msg-done="{% trans 'New pair generated. Save the page, then send both values to the partner over a secure channel.' %}"
     data-msg-error="{% trans 'Could not generate the keys. Reload the page and try again.' %}">
    <button type="button" class="button button-small button-secondary" data-federation-generate>
        {% trans "Generate key pair" %}
    </button>
    {% if self.instance.pk %}
        <button type="submit" class="button button-small button-secondary" formnovalidate
                formaction="{% url 'federation_test_connection' self.instance.pk %}">
            {% trans "Test connection" %}
        </button>
        <p class="help">{% trans "The test uses the saved values: save your changes first." %}</p>
    {% else %}
        <p class="help">{% trans "Save the club first, then you can test the connection." %}</p>
    {% endif %}
    <p class="help" role="status" aria-live="polite" data-federation-status></p>
</div>
<script src="{% static 'js/admin_federation_keys.js' %}" defer></script>
